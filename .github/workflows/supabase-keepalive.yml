name: Supabase database health

on:
  schedule:
    # UTC, three small database reads per day; avoid the busy top of the hour.
    - cron: '17 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check database connection
        run: node scripts/keepalive.mjs
